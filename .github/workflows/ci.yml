name: Fintry CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release version and changelog
        run: python3 scripts/check_release.py
      - name: Version increment against PR base
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_release.py --base "${{ github.event.pull_request.base.sha }}"
      - name: Host operation failure paths
        run: python3 -m unittest discover -s scripts -p test_ops.py -v
      - name: JavaScript syntax
        run: |
          node --check backend/src/main/resources/static/billing.js
          node --check backend/src/main/resources/static/operations.js
          node --check backend/src/main/resources/static/ux.js
          node --check backend/src/main/resources/static/pending.js
          node --check backend/src/main/resources/static/imports.js
          node --check backend/src/main/resources/static/reconciliation.js
          node --check backend/src/main/resources/static/budgets.js
          node --check backend/src/main/resources/static/commerce.js
          node --check backend/src/main/resources/static/proposals.js
          node --check backend/src/main/resources/static/navigation.js
          node --check backend/src/main/resources/static/app.js
          node --check backend/src/main/resources/static/theme.js
      - name: H2 integration tests
        working-directory: backend
        run: sh mvnw -B verify
      - name: PostgreSQL integration tests
        working-directory: backend
        run: sh mvnw -B -Dspring.profiles.active=postgres-test verify
      - name: Docker image
        run: docker build -t fintry-ci .
      - name: Production TLS, SMTP and backup restoration
        run: python3 scripts/production_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: fintry-java21
          path: backend/target/fintry.jar
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fintry_test
          POSTGRES_USER: fintry
          POSTGRES_PASSWORD: fintry-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintry -d fintry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
