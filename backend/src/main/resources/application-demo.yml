# Local single-user-process evaluation without Docker. Data persists in ./data.
spring:
  datasource:
    url: jdbc:h2:file:./data/fintry;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=30000
    username: sa
    password: ""
  flyway:
    locations: classpath:db/demo
