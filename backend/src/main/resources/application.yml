spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: fintry
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintry}
    username: ${DB_USER:fintry}
    password: ${DB_PASSWORD:fintry}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health

fintry:
  version: "@project.version@"
