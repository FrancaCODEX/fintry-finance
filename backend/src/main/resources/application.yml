spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: fintry
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintry}
    username: ${DB_USER:fintry}
    password: ${DB_PASSWORD:fintry}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
management:
  health:
    mail:
      enabled: ${fintry.mail.enabled:false}
  endpoints:
    web:
      exposure:
        include: health

fintry:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@fintry.local}
  version: "@project.version@"
